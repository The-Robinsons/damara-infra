apiVersion: apps/v1
kind: Deployment
metadata:
  name: damara-fe
  namespace: damara
  labels:
    app: damara-fe

spec:
  replicas: 2

  selector:
    matchLabels:
      app: damara-fe

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  template:
    metadata:
      labels:
        app: damara-fe

    spec:
      serviceAccountName: damara-runtime

      imagePullSecrets:
        - name: ghcr-credentials

      containers:
        - name: damara-fe
          image: ghcr.io/the-robinsons/damara-fe:39194bf824df8064b7c754d766c4bb7e4e2822f5
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 80
              protocol: TCP

          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 3
            timeoutSeconds: 2
            failureThreshold: 10

          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi

---
apiVersion: v1
kind: Service
metadata:
  name: damara-fe
  namespace: damara
  labels:
    app: damara-fe

spec:
  type: ClusterIP

  selector:
    app: damara-fe

  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
