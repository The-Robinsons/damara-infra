apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: damara
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/The-Robinsons/damara-infra.git
    targetRevision: main
    path: k8s/apps/damara

  destination:
    server: https://kubernetes.default.svc
    namespace: damara

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
